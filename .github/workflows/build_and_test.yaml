name: Build and test

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod

      - name: Check go fix
        run: |
          if ! go fix -diff ./...; then
            echo "::error::go fix found changes. Run 'go fix ./...' locally and commit the result."
            exit 1
          fi

      - name: Build
        run: go build ./...

  test:
    runs-on: ubuntu-24.04
    needs: build
    steps:
      - uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod

      - name: Run tests
        run: go test ./...

      - name: Run fuzz test
        run: go test ./rbtree -run '^$' -fuzz '^Fuzz' -fuzztime 10s
